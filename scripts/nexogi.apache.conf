# NexoGI (Msoft PHP) — site Apache em https://sistemacg.com
# Instalar: sudo cp scripts/nexogi.apache.conf /etc/apache2/sites-available/nexogi.conf
#           sudo a2dissite 000-default && sudo a2ensite nexogi && sudo a2enmod ssl
#           sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Certificado autoassinado gerado em /home/suporte/nexogi-tls/ e copiado para
# /etc/ssl/nexogi/ (SANs: sistemacg.com + 172.16.1.13, validade ~825 dias).
# Para tirar o aviso do navegador, instalar sistemacg.crt como Autoridade de
# Certificacao Raiz Confiavel nos PCs (via GPO ou certmgr.msc).

# Porta 80: redireciona tudo para HTTPS
<VirtualHost *:80>
    ServerName sistemacg.com
    Redirect permanent / https://sistemacg.com/
</VirtualHost>

# Porta 443: o app
<VirtualHost *:443>
    ServerName sistemacg.com
    DocumentRoot /home/suporte/Documents/NexoGI/public

    <Directory /home/suporte/Documents/NexoGI/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    SSLEngine on
    SSLCertificateFile    /etc/ssl/nexogi/sistemacg.crt
    SSLCertificateKeyFile /etc/ssl/nexogi/sistemacg.key

    ErrorLog ${APACHE_LOG_DIR}/nexogi_error.log
    CustomLog ${APACHE_LOG_DIR}/nexogi_access.log combined
</VirtualHost>
